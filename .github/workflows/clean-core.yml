name: Clean interpreter core
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/bootstrap.py
      - run: python3 tools/verify_core.py --dafny .tools/dafny/dafny --output evidence/core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-core-evidence
          path: evidence/core
